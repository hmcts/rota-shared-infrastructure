trigger: none
pr: none

parameters:
  - name: blobName
    displayName: Name of the anonymised dump in the Demo container
    type: string
    default: ''

pool:
  name: hmcts-cftptl-agent-pool

jobs:
  - job: distribute
    displayName: Copy Demo anonymised dump to AAT
    timeoutInMinutes: 150
    steps:
      - task: AzureCLI@2
        displayName: Copy dump to AAT
        inputs:
          azureSubscription: DTS-CFTPTL-INTSVC
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: $(Build.SourcesDirectory)/scripts/distribute-anonymised-dump.sh
        env:
          BLOB_NAME: ${{ parameters.blobName }}
