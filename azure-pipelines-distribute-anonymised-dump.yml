trigger: none
pr: none

pool:
  name: hmcts-cftptl-agent-pool

jobs:
  - job: test_blob_permissions
    displayName: Test Demo blob upload and download permissions
    timeoutInMinutes: 10
    steps:
      - task: AzureCLI@2
        displayName: Upload and download a Demo test blob
        inputs:
          azureSubscription: DTS-CFTPTL-INTSVC
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: $(Build.SourcesDirectory)/scripts/test-blob-permissions.sh
