trigger: none
pr: none

parameters:
  - name: pitrTimestamp
    displayName: Restore point in UTC (YYYY-MM-DDTHH:mm:ssZ)
    type: string
    default: ''
  - name: anonymisationVersion
    displayName: Released rotadb-migration anonymisation package version
    type: string
    default: ''

pool:
  name: hmcts-cftptl-agent-pool

variables:
  anonymisationRunId: $(Build.BuildId)-$(System.JobAttempt)
  # Placeholder: replace with the Maven repository name once the package is published.
  artifactoryRepository: 'REPLACE_WITH_MAVEN_REPOSITORY'
  # The Ubuntu agent installs postgresql-client, exposing commands under /usr/bin.
  postgresqlHome: '/usr'
  anonymisationPasswordSecret: 'portal-owner-password'

jobs:
  - job: anonymise
    displayName: Anonymise production database
    # The disposable agent has a three-hour lifetime; leave time for cleanup and startup.
    timeoutInMinutes: 120
    cancelTimeoutInMinutes: 30
    steps:
      - task: AzureCLI@2
        displayName: Restore, anonymise and encrypt production mojdb
        inputs:
          azureSubscription: DTS-CFTPTL-INTSVC
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: $(Build.SourcesDirectory)/scripts/anonymise-database.sh
        env:
          RUN_ID: $(anonymisationRunId)
          PITR_TIMESTAMP: ${{ parameters.pitrTimestamp }}
          ANONYMISATION_VERSION: ${{ parameters.anonymisationVersion }}
          ARTIFACTORY_REPOSITORY: $(artifactoryRepository)
          POSTGRESQL_HOME: $(postgresqlHome)
          ANONYMISATION_PASSWORD_SECRET: $(anonymisationPasswordSecret)
          ARTIFACTORY_TOKEN: $(rotaAnonymisationArtifactoryToken)

      # Retry server cleanup with a fresh Azure login if the main task was interrupted.
      - task: AzureCLI@2
        displayName: Remove temporary database server, local files and checks report
        condition: always()
        inputs:
          azureSubscription: DTS-CFTPTL-INTSVC
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: $(Build.SourcesDirectory)/scripts/anonymise-database.sh
          arguments: cleanup
        env:
          RUN_ID: $(anonymisationRunId)
